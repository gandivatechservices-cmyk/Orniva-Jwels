<svg width="240" height="180" viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Tag shadow -->
    <filter id="tagShadow" x="10" y="0" width="220" height="180" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#991b1b" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
    </filter>

    <!-- Tag red gradient -->
    <linearGradient id="tagRed" x1="40" y1="20" x2="190" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Tag 3D side edge -->
    <linearGradient id="tagEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Cutout inner shadow -->
    <filter id="cutoutShadow" x="0" y="0" width="200" height="200" filterUnits="userSpaceOnUse">
      <feOffset dx="1" dy="2"/>
      <feGaussianBlur stdDeviation="1.5"/>
      <feComposite operator="out" in2="SourceGraphic"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.4  0 0 0 0 0.05  0 0 0 0 0.05  0 0 0 0.5 0"/>
    </filter>
  </defs>

  <g filter="url(#tagShadow)">
    <!-- 3D depth base -->
    <path d="M 65 30 L 145 15 C 158 13 170 20 176 31 L 205 92 C 210 103 206 116 196 123 L 138 163 C 127 170 114 168 106 158 L 52 90 C 46 82 46 72 50 63 Z" fill="url(#tagEdge)" transform="translate(0, 6)" />

    <!-- Main Tag Shape (angled) -->
    <path d="M 65 30 L 145 15 C 158 13 170 20 176 31 L 205 92 C 210 103 206 116 196 123 L 138 163 C 127 170 114 168 106 158 L 52 90 C 46 82 46 72 50 63 Z" fill="url(#tagRed)" />

    <!-- Top Tag Hole / Eyelet -->
    <circle cx="168" cy="42" r="9" fill="#fceae8" />
    <circle cx="168" cy="42" r="9" stroke="#7f1d1d" stroke-width="2.5" opacity="0.4" />
    <circle cx="168" cy="42" r="6" fill="#fceae8" />

    <!-- Cutout '%' Sign -->
    <g transform="rotate(-15 125 95)" fill="#ffffff">
      <!-- Upper circle -->
      <circle cx="95" cy="72" r="14" fill="#ffffff" />
      <circle cx="95" cy="72" r="7" fill="#b91c1c" />

      <!-- Slash line -->
      <rect x="122" y="52" width="12" height="74" rx="6" transform="rotate(35 122 52)" fill="#ffffff" />

      <!-- Lower circle -->
      <circle cx="145" cy="118" r="14" fill="#ffffff" />
      <circle cx="145" cy="118" r="7" fill="#b91c1c" />
    </g>
  </g>
</svg>
